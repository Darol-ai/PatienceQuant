services:
  backend:
    build: ./backend
    environment:
      DATA_MODE: ${DATA_MODE:-real}
      DEMO_AS_OF: "${DEMO_AS_OF:-}"
      AUTO_REBALANCE_POLL_SECONDS: "${AUTO_REBALANCE_POLL_SECONDS:-60}"
      DATABASE_URL: sqlite:///./data/patience_quant.db
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    volumes:
      # 绑定宿主机目录而不是具名卷：沪深300/30支候选池策略依赖的真实
      # parquet数据和训练好的模型文件(几百MB)不在git里，也不在Docker
      # 镜像构建过程中生成——首次部署前需要在宿主机/训练环境跑
      # backend/scripts下的对应脚本生成这些文件到 ./backend/data，再
      # 启动容器；具体清单见 docs/部署-真实数据准备.md。
      - ./backend/data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
