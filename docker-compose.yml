services:
  backend:
    build: ./backend
    environment:
      DATA_MODE: ${DATA_MODE:-real}
      DEMO_AS_OF: "${DEMO_AS_OF:-}"
      AUTO_REBALANCE_POLL_SECONDS: "${AUTO_REBALANCE_POLL_SECONDS:-60}"
      DATABASE_URL: sqlite:///./data/patience_quant.db
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      TUSHARE_HTTP_URL: ${TUSHARE_HTTP_URL:-https://tuaremax.top}
    volumes:
      # 绑定宿主机目录而不是具名卷：沪深300/30支候选池策略依赖的
      # parquet数据和训练好的模型文件经Git LFS随仓库分发在
      # ./backend/data，容器直接使用；清单见 docs/部署-真实数据准备.md。
      - ./backend/data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
