[project]
name = "patience-quant-backend"
version = "0.1.0"
description = "Low-frequency multi-factor investing platform MVP"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "pandas>=1.5,<3",
  "numpy>=1.24,<3",
  "httpx>=0.27,<1",
  "openai>=1.52,<2",
]

[project.optional-dependencies]
real-data = ["akshare>=1.16"]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
