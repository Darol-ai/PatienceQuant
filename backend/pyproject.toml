[project]
name = "patience-quant-backend"
version = "0.1.0"
description = "Low-frequency multi-factor investing platform MVP"
requires-python = ">=3.10"  # xgboost 3.4 需要 3.10 以上；开发与成绩卡快照用的是 3.13
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "pandas>=1.5,<3",
  "numpy>=1.24,<3",
  "httpx>=0.27,<1",
  "openai>=1.52,<2",
  "lightgbm>=4.5,<5",
  "xgboost>=3.4,<4",
  "pypdf>=5,<7",
  "pyarrow>=15",        # 本地行情库的 parquet 读写
  "scipy>=1.11",        # ICU 均线择时（稳健回归）
  "scikit-learn>=1.3",  # 旧的离线训练模块
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
real-data = ["tushare==1.4.24", "akshare>=1.16"]
# 系统内训练 LSTM 用（ADR-0047 第 6 条、ADR-0053）。Linux 上 PyPI 的 torch 默认就是 CUDA 版；
# 显卡驱动较旧时可改从 PyTorch 官方源装对应版本，例如：
#   pip install torch --index-url https://download.pytorch.org/whl/cu128
# 没有显卡时 LSTM 用 CPU 训练，只是更慢。
training = ["torch>=2.7"]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
